name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin
      - name: Check logic and collectors
        run: |
          node --test tests/*.test.cjs
          python3 gnome/tests/check-collectors
          python3 gnome/tests/security.py
      - name: Scan history for secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
      - name: Build and verify package
        run: |
          ./gnome/build.sh
          python3 gnome/tests/check-package.py
          cd build
          sha256sum headroom@steveclarke.github.io.zip > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension
          path: |
            build/*.zip
            build/SHA256SUMS
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension
          path: build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/*.zip build/SHA256SUMS --verify-tag --title "Headroom $RELEASE_TAG" --notes 'GNOME Shell extension for Ubuntu 24.04 / GNOME 46. Download the extension ZIP and follow the installation instructions in the README. No compilation required. SHA256SUMS is included for download verification.'
